<!doctype html>
<html lang="en">
<head>

<title>Quintet</title>

<style>
[hidden]{display:none!important}
:root{color-scheme:light}

/* Layout: one-screen app column. Masthead, mode switch, board, keyboard. Stats and help open as an overlay panel. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#16212B; --muted:#586571; --line:#C4CCD4; --line-strong:#7E8B97;
  --key:#D9DFE5; --key-ink:#16212B;
  --hit:#1F7A68; --hit-ink:#FFFFFF; --near:#E3A72F; --near-ink:#1D1503; --miss:#68747F; --miss-ink:#FFFFFF;
  --accent:#1F7A68; --toast:#16212B; --toast-ink:#F4F7F9; --scrim:rgba(16,22,28,.55);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t:min(62px,14vw,7.4dvh);
}
:root[data-contrast]{ --hit:#2C6DB4; --near:#E8782E; --near-ink:#1D0E03; --accent:#2C6DB4 }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --surface:#18212A; --ink:#E8EDF1; --muted:#97A4AF; --line:#33414E; --line-strong:#6A7886;
    --key:#2A3541; --key-ink:#E8EDF1;
    --hit:#2E9A84; --hit-ink:#04120E; --near:#D9A22E; --near-ink:#1D1503; --miss:#3B4651; --miss-ink:#E8EDF1;
    --accent:#4DB8A1; --toast:#E8EDF1; --toast-ink:#10161C; --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
  :root[data-contrast]:not([data-theme="light"]){ --hit:#5AA2F0; --hit-ink:#06121F; --near:#EE8A3E; --near-ink:#1D0E03; --accent:#5AA2F0 }
}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --ink:#E8EDF1; --muted:#97A4AF; --line:#33414E; --line-strong:#6A7886;
  --key:#2A3541; --key-ink:#E8EDF1;
  --hit:#2E9A84; --hit-ink:#04120E; --near:#D9A22E; --near-ink:#1D1503; --miss:#3B4651; --miss-ink:#E8EDF1;
  --accent:#4DB8A1; --toast:#E8EDF1; --toast-ink:#10161C; --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
:root[data-theme="dark"][data-contrast]{ --hit:#5AA2F0; --hit-ink:#06121F; --near:#EE8A3E; --near-ink:#1D0E03; --accent:#5AA2F0 }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.4;
  display:flex; flex-direction:column; align-items:center;
  padding-block:8px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.masthead{width:100%; max-width:500px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:6px; border-bottom:1px solid var(--line)}
.brand{min-width:0}
.brand h1{margin:0; font-family:var(--font-display); font-weight:800; font-size:28px; letter-spacing:.14em; line-height:1; text-transform:uppercase}
.brand p{margin:3px 0 0; color:var(--muted); font-size:12.5px}
.tools{display:flex; gap:2px}
.icon-btn{width:40px; height:40px; display:grid; place-items:center; background:transparent; border:0; border-radius:8px; color:var(--ink)}
.icon-btn:hover{background:var(--key)}
.icon-btn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{color:var(--accent)}

.modebar{display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center}
.newword{padding:7px 12px; background:transparent; border:1.5px solid var(--line-strong); border-radius:8px; font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink)}
.newword:hover{background:var(--key)}
.modes{display:flex; gap:0; margin-top:0; border:1.5px solid var(--line-strong); border-radius:8px; overflow:hidden}
.modes button{background:transparent; border:0; padding:6px 16px; font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}

.stage{flex:1; min-height:0; width:100%; display:grid; place-items:center; position:relative}
.board{display:grid; gap:6px}
.row{display:grid; grid-template-columns:repeat(5,var(--t)); gap:6px}
.tile{
  width:var(--t); height:var(--t); display:grid; place-items:center;
  border:2px solid var(--line); border-radius:4px; background:transparent; color:var(--ink);
  font-family:var(--font-display); font-weight:700; font-size:calc(var(--t)*.56); text-transform:uppercase; user-select:none;
}
.tile[data-f="1"]{border-color:var(--line-strong)}
.tile[data-s="hit"]{background:var(--hit); border-color:var(--hit); color:var(--hit-ink)}
.tile[data-s="near"]{background:var(--near); border-color:var(--near); color:var(--near-ink)}
.tile[data-s="miss"]{background:var(--miss); border-color:var(--miss); color:var(--miss-ink)}

@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes pop{50%{transform:scale(1.09)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.tile.reveal{animation:flip .5s ease both}
.tile.pop{animation:pop .12s ease}
.row.shake{animation:shake .45s ease}
.row.win .tile{animation:hop .6s ease both; animation-delay:calc(var(--i)*90ms)}
@media (prefers-reduced-motion:reduce){.tile,.row,.row .tile{animation:none!important}}

.toast{position:absolute; top:4px; left:50%; transform:translateX(-50%); z-index:5; max-width:92%; padding:9px 16px; border-radius:8px; background:var(--toast); color:var(--toast-ink); font-weight:700; font-size:14px; text-align:center; pointer-events:none}

.kb{width:100%; max-width:500px; display:flex; flex-direction:column; gap:7px; padding-top:6px}
.kb-row{display:flex; gap:5px; justify-content:center}
.key{
  flex:1 1 0; min-width:0; height:min(52px,7.2dvh); display:grid; place-items:center; padding:0;
  background:var(--key); color:var(--key-ink); border:0; border-radius:6px;
  font-family:var(--font-body); font-weight:700; font-size:15px; text-transform:uppercase; user-select:none; -webkit-tap-highlight-color:transparent;
}
.key.wide{flex:1.55 1 0; font-size:12px; letter-spacing:.02em}
.key svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.key[data-s="hit"]{background:var(--hit); color:var(--hit-ink)}
.key[data-s="near"]{background:var(--near); color:var(--near-ink)}
.key[data-s="miss"]{background:var(--miss); color:var(--miss-ink)}
.spacer{flex:.5 1 0}

.overlay{position:fixed; inset:0; z-index:20; background:var(--scrim); display:grid; place-items:center; padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.panel{position:relative; width:100%; max-width:420px; max-height:100%; overflow-y:auto; background:var(--surface); border-radius:12px; padding:22px 20px 20px; box-shadow:0 12px 40px rgba(0,0,0,.28)}
.close{position:absolute; top:8px; right:8px}
.panel h2{margin:0 0 14px; font-family:var(--font-display); font-weight:800; font-size:20px; letter-spacing:.1em; text-transform:uppercase; text-align:center}
.panel h3{margin:18px 0 8px; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:center}
.panel p{margin:0 0 10px}
.nums{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center}
.num b{display:block; font-family:var(--font-display); font-size:30px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums}
.num span{font-size:11.5px; color:var(--muted); line-height:1.2; display:block}
.dist{display:grid; grid-template-columns:auto 1fr; gap:5px 8px; align-items:center}
.dist .g{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
.bar{display:flex; justify-content:flex-end}
.bar span{min-width:24px; padding:1px 7px; background:var(--miss); color:var(--miss-ink); font-size:13px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; border-radius:3px}
.bar span.cur{background:var(--hit); color:var(--hit-ink)}
.result{text-align:center}
.result .answer{font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:.2em; text-transform:uppercase; margin:2px 0 4px}
.cd{font-variant-numeric:tabular-nums; font-weight:700}
.share{width:100%; margin:6px 0 10px; padding:10px; border:1.5px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.25; resize:none; text-align:center}
.btn{display:block; width:100%; padding:12px 16px; margin-top:8px; border:0; border-radius:8px; background:var(--accent); color:var(--hit-ink); font-weight:700; font-size:15px; letter-spacing:.04em; text-transform:uppercase}
.btn.alt{background:transparent; color:var(--ink)!important; border:1.5px solid var(--line-strong); margin-top:0}
:root:not([data-theme="dark"]) .btn{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#04120E}}
.tabs{display:flex; gap:0; margin:0 0 16px; border:1.5px solid var(--line-strong); border-radius:8px; overflow:hidden}
.tabs button{flex:1; padding:7px 4px; background:transparent; border:0; font-size:12.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--bg)}
.legend{display:grid; gap:10px; margin:12px 0}
.legend div{display:flex; align-items:center; gap:12px}
.legend .tile{--t:38px; flex:none; font-size:21px}
.hint{color:var(--muted); font-size:13.5px}
</style>
</head>

<header class="masthead">
  <div class="brand">
    <h1>Quintet</h1>
    <p>Six tries. Five letters.</p>
  </div>
  <div class="tools">

    <button class="icon-btn" id="btn-stats" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-6"/></svg></button>

  </div>
</header>

<div class="modebar">
<div class="modes" role="group" aria-label="Game mode">
  <button id="mode-daily" aria-pressed="true">Today</button>
  <button id="mode-practice" aria-pressed="false">Unlimited</button>
</div>
<button class="newword" id="btn-new" hidden>Shuffle new word</button>
</div>

<main class="stage">
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="board" id="board" aria-label="Guess grid"></div>
</main>

<div class="kb" id="kb" aria-label="Keyboard"></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Quintet" hidden>
  <div class="panel">
    <button class="icon-btn close" id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="panel-body"></div>
  </div>
</div>

function dayNumber(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)}

function evaluate(g,t){
  var r=["miss","miss","miss","miss","miss"],cnt={},i;
  for(i=0;i<COLS;i++){ if(g[i]===t[i]) r[i]="hit"; else cnt[t[i]]=(cnt[t[i]]||0)+1; }
  for(i=0;i<COLS;i++){ if(r[i]==="hit") continue; if(cnt[g[i]]>0){r[i]="near"; cnt[g[i]]--;} }
  return r;
}

/* board and keyboard */
function buildBoard(){
  boardEl.innerHTML=""; rows=[];
  for(var r=0;r<ROWS;r++){
    var row=document.createElement("div"); row.className="row"; row.setAttribute("role","row");
    var tiles=[];
    for(var c=0;c<COLS;c++){
      var t=document.createElement("div"); t.className="tile"; t.style.setProperty("--i",c); t.setAttribute("role","cell");
      row.appendChild(t); tiles.push(t);
    }
    boardEl.appendChild(row); rows.push({el:row,tiles:tiles});
  }
}
function buildKeyboard(){
  var kb=$("kb"), layout=["qwertyuiop","asdfghjkl","zxcvbnm"];
  layout.forEach(function(line,idx){
    var row=document.createElement("div"); row.className="kb-row";
    if(idx===1){var s1=document.createElement("div"); s1.className="spacer"; row.appendChild(s1);}
    if(idx===2){row.appendChild(makeKey("ENTER","Enter","wide"));}
    line.split("").forEach(function(ch){row.appendChild(makeKey(ch,ch))});
    if(idx===2){row.appendChild(makeKey("BACK",null,"wide"));}
    if(idx===1){var s2=document.createElement("div"); s2.className="spacer"; row.appendChild(s2);}
    kb.appendChild(row);
  });
  kb.addEventListener("mousedown",function(e){e.preventDefault()});
}
function makeKey(code,label,cls){
  var b=document.createElement("button"); b.className="key"+(cls?" "+cls:""); b.type="button"; b.dataset.k=code;
  if(code==="BACK"){ b.setAttribute("aria-label","Delete"); b.innerHTML='<svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M14 10l4 4M18 10l-4 4"/></svg>'; }
  else { b.textContent=label; if(code==="ENTER") b.setAttribute("aria-label","Enter"); }
  b.addEventListener("click",function(){press(code)});
  keys[code]=b; return b;
}
function render(){
  for(var r=0;r<ROWS;r++){
    var ev=r<guesses.length?evaluate(guesses[r],target):null;
    for(var c=0;c<COLS;c++){
      var t=rows[r].tiles[c], ch="", s="", f="";
      if(ev){ch=guesses[r][c]; s=ev[c]; f="1";}
      else if(r===guesses.length&&c<cur.length){ch=cur[c]; f="1";}
      t.textContent=ch;
      if(s) t.dataset.s=s; else delete t.dataset.s;
      if(f) t.dataset.f=f; else delete t.dataset.f;
      t.setAttribute("aria-label",ch?ch.toUpperCase()+(s?", "+s:""):"empty");
    }
  }
}
function updateKeys(){
  var best={},rank={miss:1,near:2,hit:3};
  guesses.forEach(function(g){
    var ev=evaluate(g,target);
    for(var i=0;i<COLS;i++){ if(!best[g[i]]||rank[ev[i]]>rank[best[g[i]]]) best[g[i]]=ev[i]; }
  });
  Object.keys(keys).forEach(function(k){
    if(k.length!==1) return;
    if(best[k]) keys[k].dataset.s=best[k]; else delete keys[k].dataset.s;
  });
}

/* toast */
function toast(msg,sticky){
  var el=$("toast"); el.textContent=msg; el.hidden=false;
  clearTimeout(toastTimer);
  if(!sticky) toastTimer=setTimeout(function(){el.hidden=true},1700);
}
function hideToast(){clearTimeout(toastTimer); $("toast").hidden=true}
function shake(){
  var el=rows[guesses.length].el; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  setTimeout(function(){el.classList.remove("shake")},500);
}

/* game flow */
function press(code){
  if(busy||over||!$("overlay").hidden) return;
  if(code==="ENTER") return submit();
  if(code==="BACK"){ if(cur.length){cur=cur.slice(0,-1); render();} return; }
  if(cur.length<COLS){
    cur+=code; render();
    var t=rows[guesses.length].tiles[cur.length-1]; t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
    setTimeout(function(){t.classList.remove("pop")},140);
  }
}
function submit(){
  if(cur.length<COLS){shake(); return toast("Not enough letters");}
  if(!VALID.has(cur)){shake(); return toast("Not in word list");}
  var g=cur, rowIdx=guesses.length, ev=evaluate(g,target), step=reduce?0:260, tiles=rows[rowIdx].tiles;
  busy=true; guesses.push(g); cur="";
  tiles.forEach(function(t,i){
    if(!reduce){ t.style.animationDelay=(i*step)+"ms"; t.classList.add("reveal"); }
    setTimeout(function(){t.dataset.s=ev[i]; t.setAttribute("aria-label",g[i].toUpperCase()+", "+ev[i]);},i*step+(reduce?0:step));
  });
  setTimeout(function(){
    tiles.forEach(function(t){t.classList.remove("reveal"); t.style.animationDelay=""});
    busy=false; updateKeys(); afterGuess(g,rowIdx);
  },(COLS-1)*step+(reduce?0:520)+20);
}
function afterGuess(g,rowIdx){
  if(g===target){
    over=true; won=true;
    rows[rowIdx].el.classList.add("win");
    toast(["Genius","Magnificent","Impressive","Splendid","Great","Phew"][rowIdx]);
    finish();
  } else if(guesses.length>=ROWS){
    over=true; won=false; toast(target.toUpperCase(),true); finish();
  } else { save$(); }
}
function finish(){
  save$(); recordResult();
  setTimeout(function(){ if(over) openPanel("stats"); },1500);
}
function saveDaily(){ save("quintet.daily",{dn:dn,guesses:guesses,over:over,won:won}); }
function saveFree(){ save("quintet.free",{target:target,guesses:guesses,over:over,won:won}); }
function save$(){ if(mode==="daily") saveDaily(); else saveFree(); }

function statsKey(){return mode==="daily"?"quintet.stats":"quintet.stats.free"}
function readStats(key){
  var s=load(key)||{};
  return {played:s.played||0,wins:s.wins||0,streak:s.streak||0,best:s.best||0,lastWin:typeof s.lastWin==="number"?s.lastWin:-99,dist:(s.dist&&s.dist.length===6)?s.dist.map(function(n){return n||0}):[0,0,0,0,0,0]};
}
function loadStats(){return readStats(statsKey())}
function statsFor(tab){
  var d=readStats("quintet.stats"), f=readStats("quintet.stats.free");
  if(tab==="daily") return d;
  if(tab==="free") return f;
  return {played:d.played+f.played,wins:d.wins+f.wins,streak:0,best:Math.max(d.best,f.best),lastWin:-99,dist:d.dist.map(function(n,i){return n+f.dist[i]})};
}
function recordResult(){
  var s=loadStats(); s.played++;
  if(won){
    s.wins++; s.dist[guesses.length-1]++;
    s.streak=(mode==="daily")?((s.lastWin===dn-1)?s.streak+1:1):s.streak+1;
    if(mode==="daily") s.lastWin=dn;
    s.best=Math.max(s.best,s.streak);
  } else { s.streak=0; }
  save(statsKey(),s);

/* unlimited mode draws from a shuffled bag, so a word does not repeat until the whole pool has been played */
function rnd(n){try{var a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
function nextFreeTarget(){
  var bag=load("quintet.bag"), meta=load("quintet.bagmeta");

  }
  var idx=bag.pop(); save("quintet.bag",bag);
  return POOL[idx];
}

function newGame(m,fresh){
  mode=m; dn=dayNumber(); guesses=[]; cur=""; over=false; won=false; busy=false;
  hideToast(); $("btn-new").hidden=(m!=="practice");
  $("mode-daily").setAttribute("aria-pressed",m==="daily");
  $("mode-practice").setAttribute("aria-pressed",m==="practice");
  buildBoard();
  Object.keys(keys).forEach(function(k){delete keys[k].dataset.s});
  if(m==="daily"){
    target=dailyAnswer(dn);
    var sv=load("quintet.daily");
    if(sv&&sv.dn===dn&&Array.isArray(sv.guesses)){ guesses=sv.guesses.filter(function(x){return typeof x==="string"&&x.length===COLS}); over=!!sv.over; won=!!sv.won; }
  } else {
    var fv=load("quintet.free"), resume=!fresh&&fv&&typeof fv.target==="string"&&fv.target.length===COLS&&!fv.over&&Array.isArray(fv.guesses)&&fv.guesses.length>0;
    if(resume){ target=fv.target; guesses=fv.guesses.filter(function(x){return typeof x==="string"&&x.length===COLS}); }
    else { target=nextFreeTarget(); saveFree(); }
  }
  render(); updateKeys();
  if(over&&won){ rows[guesses.length-1].el.classList.add("win"); }
  if(over&&!won){ toast(target.toUpperCase(),true); }
}

/* panels */
function shareText(){
  var sq=contrast?{hit:"🟦",near:"🟧",miss:"⬛"}:{hit:"🟩",near:"🟨",miss:"⬛"};
  var lines=guesses.map(function(g){return evaluate(g,target).map(function(x){return sq[x]}).join("")});
  var label=mode==="daily"?String(dn-START+1):"∞";
  return "Quintet "+label+" "+(won?guesses.length:"X")+"/6\n"+lines.join("\n");
}
function countdown(){
  var d=new Date(), next=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1), ms=next-d;
  var h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000);
  return [h,m,s].map(function(n){return String(n).padStart(2,"0")}).join(":");
}
function tileSample(ch,s){return '<div class="tile" data-f="1" data-s="'+s+'">'+ch+'</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function syncText(){
  if(sync.state==="synced") return "Saved to your Claude account"+(sync.name?" ("+esc(sync.name)+")":"")+". Your stats follow you across devices.";
  if(sync.state==="syncing") return "Syncing your stats\u2026";
  if(sync.state==="error") return "Could not reach your account just now. Stats are safe in this browser and will sync after your next game.";
  return "Stats are saved in this browser. Open this page signed in to Claude and they sync across your devices.";
}
function openPanel(which,keepTab){
  var body=$("panel-body"), html="", wasHidden=$("overlay").hidden;
  panelKind=which;
  if(which==="help"){
    html='<h2>How to play</h2>'+
      '<p>Find the hidden five-letter word in six tries. Each guess must be a real word.</p>'+
      '<div class="legend">'+
        '<div>'+tileSample("c","hit")+'<span>Right letter, right spot</span></div>'+
        '<div>'+tileSample("r","near")+'<span>Right letter, wrong spot</span></div>'+
        '<div>'+tileSample("t","miss")+'<span>Letter is not in the word</span></div>'+
      '</div>'+
      '<p class="hint">Today is one shared word for everyone and resets at midnight. Unlimited gives you a fresh puzzle as soon as you finish one, with no daily cap and no repeats until the whole word pool is used. The statistics panel can show each mode on its own or all games together.</p>';
  } else {
    if(!keepTab) statsTab=(mode==="daily")?"daily":"free";
    var s=statsFor(statsTab), max=Math.max.apply(null,s.dist.concat([1])), dd=readStats("quintet.stats"), ff=readStats("quintet.stats.free");
    var winPct=s.played?Math.round(s.wins/s.played*100):0, nums;
    if(statsTab==="all"){
      var tot=0; s.dist.forEach(function(n,i){tot+=n*(i+1)});
      nums=num(s.played,"Played")+num(winPct,"Win %")+num(s.wins,"Wins")+num(s.wins?(tot/s.wins).toFixed(1):"\u2013","Avg guesses");
    } else {
      var streak=(statsTab==="free")?s.streak:((s.lastWin>=dn-1)?s.streak:0);
      nums=num(s.played,"Played")+num(winPct,"Win %")+num(streak,"Current streak")+num(s.best,"Best streak");
    }
    html='<h2>Statistics</h2>'+
      '<div class="tabs" role="tablist" aria-label="Statistics view">'+
      [["all","All games"],["daily","Daily"],["free","Unlimited"]].map(function(x){return '<button role="tab" data-tab="'+x[0]+'" aria-selected="'+(statsTab===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>'+
      '<div class="nums">'+nums+'</div>'+
      (statsTab==="all"?'<p class="hint" style="text-align:center;margin:10px 0 0">Daily '+dd.played+' played \u00B7 Unlimited '+ff.played+' played</p>':'')+
      '<h3>Guess distribution</h3><div class="dist">'+
      s.dist.map(function(n,i){
        var curBar=(over&&won&&guesses.length===i+1&&(statsTab==="all"||statsTab===(mode==="daily"?"daily":"free")));
        return '<span class="g">'+(i+1)+'</span><div class="bar"><span class="'+(curBar?"cur":"")+'" style="width:'+Math.max(8,n/max*100)+'%">'+n+'</span></div>';
      }).join("")+'</div>';
    if(over){
      html+='<h3>'+(mode==="daily"?"Today":"This puzzle")+'</h3><div class="result">';
      if(!won) html+='<p style="margin-bottom:0">The word was</p>';
      html+=(won?'':'<div class="answer">'+target+'</div>')+
        '<textarea class="share" id="share" rows="'+(guesses.length+1)+'" readonly aria-label="Your result">'+shareText()+'</textarea>'+
        '<button class="btn alt" id="copy">Copy result</button>'+
        '<button class="btn" id="again">Next puzzle</button>';
      if(mode==="daily") html+='<p class="hint" style="margin:12px 0 0">Next daily word in <span class="cd" id="cd">'+countdown()+'</span>. Play as many extra puzzles as you like.</p>';
      html+='</div>';
    }
    html+='<h3>Account</h3><p class="hint sync-note" style="text-align:center;margin:0">'+syncText()+'</p>';
  }
  body.innerHTML=html;
  if(wasHidden){ opener=document.activeElement; $("overlay").hidden=false; $("close").focus(); }
  var copy=$("copy"); if(copy) copy.addEventListener("click",doCopy);
  var again=$("again"); if(again) again.addEventListener("click",function(){closePanel(); newGame("practice",true)});
  Array.prototype.forEach.call(body.querySelectorAll("[data-tab]"),function(b){b.addEventListener("click",function(){statsTab=b.getAttribute("data-tab"); openPanel("stats",true)})});
  clearInterval(cdTimer);
  if($("cd")) cdTimer=setInterval(function(){var e=$("cd"); if(e) e.textContent=countdown();},1000);
}
function num(v,l){return '<div class="num"><b>'+v+'</b><span>'+l+'</span></div>'}
function closePanel(){
  $("overlay").hidden=true; clearInterval(cdTimer); panelKind=null;
  if(opener&&opener.focus&&document.contains(opener)) opener.focus();
}
function doCopy(){
  var ta=$("share"), btn=$("copy"), text=ta.value;
  function manual(){ta.select(); btn.textContent="Select and copy"}
  try{
    navigator.clipboard.writeText(text).then(function(){btn.textContent="Copied"},manual);
  }catch(e){manual()}
}


/* optional account sync: private per-viewer document, only when this page is opened signed in to Claude */
function refreshPanel(){
  if(!$("overlay").hidden&&panelKind==="stats"){
    var n=document.querySelector(".sync-note"); if(n) n.innerHTML=syncText();
  }
}
function localState(){return {daily:load("quintet.daily"),free:load("quintet.free"),sd:load("quintet.stats"),sf:load("quintet.stats.free")}}
function validGuesses(a){return Array.isArray(a)&&a.every(function(x){return typeof x==="string"&&x.length===COLS})}
function dailyScore(d){return d&&d.dn===dn&&validGuesses(d.guesses)?(d.over?100:0)+d.guesses.length:-1}
function playedOf(s){return s&&typeof s.played==="number"?s.played:0}
function mergeState(l,c){
  var out={};
  out.sd=playedOf(c.sd)>playedOf(l.sd)?c.sd:l.sd;
  out.sf=playedOf(c.sf)>playedOf(l.sf)?c.sf:l.sf;
  out.daily=dailyScore(c.daily)>dailyScore(l.daily)?c.daily:(dailyScore(l.daily)>=0?l.daily:null);
  var lf=l.free&&!l.free.over&&validGuesses(l.free.guesses)&&typeof l.free.target==="string"&&l.free.target.length===COLS?l.free:null;
  var cf=c.free&&!c.free.over&&validGuesses(c.free.guesses)&&typeof c.free.target==="string"&&c.free.target.length===COLS?c.free:null;
  out.free=lf||cf||l.free||null;
  return out;
}
function schedulePush(){
  if(!sync.ref) return;
  clearTimeout(sync.timer); sync.timer=setTimeout(pushSync,500);
}
function pushSync(){
  if(!sync.ref) return;
  if(sync.busy){ sync.dirty=true; return; }
  sync.busy=true; sync.dirty=false;
  var body=localState(); body.v=1; body.updated=Date.now();
  var plain; try{plain=JSON.parse(JSON.stringify(body))}catch(e){sync.busy=false; return;}
  sync.ref.set(plain).then(function(){sync.state="synced"},function(){sync.state="error"}).then(function(){
    sync.busy=false; refreshPanel(); if(sync.dirty) pushSync();
  });
}
function initSync(){
  if(!window.claude||typeof window.claude.use!=="function") return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0], user=r[1]; if(!db||!user) return;
    return user.me().then(function(me){
      if(!me||!me.id) return;
      sync.name=me.name||""; sync.ref=db.doc("data/users/"+me.id+"/quintet"); sync.state="syncing"; refreshPanel();
      var timeout=new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"))},10000)});
      return Promise.race([sync.ref.get(),timeout]).then(function(snap){
        var cloud=snap&&snap.exists?snap.data():null, before=localState();
        if(cloud){
          var m=mergeState(before,cloud);
          if(m.sd) save("quintet.stats",m.sd);
          if(m.sf) save("quintet.stats.free",m.sf);
          if(m.daily) save("quintet.daily",m.daily);
          if(m.free) save("quintet.free",m.free);
          var after=localState();
          var dailyChanged=JSON.stringify(before.daily)!==JSON.stringify(after.daily), freeChanged=JSON.stringify(before.free)!==JSON.stringify(after.free);
          if(!busy&&cur===""&&((mode==="daily"&&dailyChanged)||(mode==="practice"&&freeChanged&&after.free&&!after.free.over))) newGame(mode);
        }
        sync.state="syncing"; pushSync();
      });
    });
  }).catch(function(){ sync.state="error"; refreshPanel(); });
}

/* wiring */
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(!$("overlay").hidden){ if(e.key==="Escape") closePanel(); return; }
  var k=e.key;
  if(k==="Enter"){e.preventDefault(); press("ENTER");}
  else if(k==="Backspace"){e.preventDefault(); press("BACK");}
  else if(/^[a-zA-Z]$/.test(k)){press(k.toLowerCase());}
});
$("overlay").addEventListener("click",function(e){if(e.target===$("overlay")) closePanel()});
$("close").addEventListener("click",closePanel);
$("btn-help").addEventListener("click",function(){openPanel("help")});
$("btn-stats").addEventListener("click",function(){openPanel("stats")});
$("mode-daily").addEventListener("click",function(){if(mode!=="daily") newGame("daily")});
$("mode-practice").addEventListener("click",function(){if(mode!=="practice") newGame("practice"); else if(over) newGame("practice",true)});
function applyContrast(){
  document.documentElement.toggleAttribute("data-contrast",contrast);
  $("btn-contrast").setAttribute("aria-pressed",contrast);
}
$("btn-contrast").addEventListener("click",function(){contrast=!contrast; save("quintet.contrast",contrast); applyContrast();});
$("btn-new").addEventListener("click",function(){ if(!busy){ newGame("practice",true); } });
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&mode==="daily"&&dayNumber()!==dn&&$("overlay").hidden) newGame("daily");
});

applyContrast(); buildKeyboard(); newGame("daily"); initSync();
})();
</script>
